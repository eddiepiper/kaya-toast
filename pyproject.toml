[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "kaya-toast"
version = "0.1.0"
description = "Deterministic AI-native PM LinkedIn content idea agent"
requires-python = ">=3.9"
dependencies = [
  "feedparser>=6.0",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
kaya-toast = "kaya_toast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
